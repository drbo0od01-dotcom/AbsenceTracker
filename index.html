<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الغيابات الجامعية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>سجل الغيابات الجامعي 📚</h1>

        <!-- نموذج لإضافة مادة جديدة -->
        <div class="card">
            <h3>إضافة مادة جديدة</h3>
            <form id="course-form">
                <input type="text" id="course-name" placeholder="اسم المادة (مثال: فسيولوجي)" required>
                <input type="number" id="max-absence" placeholder="الحد الأقصى للغياب بالساعات/المرات" required>
                <button type="submit">إضافة المادة</button>
            </form>
        </div>

        <!-- قائمة المواد والإحصائيات -->
        <div class="card">
            <h3>مقرراتي الدراسية</h3>
            <div id="courses-list">
                <!-- سيتم تعبئة المواد هنا برمجياً -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
