<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الغيابات الجامعي</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .course-item { background: #fafafa; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .course-info { display: flex; justify-content: space-between; align-items: center; }
        .badge { background-color: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-lab { background-color: #fce7f3; color: #be185d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>سجل الغيابات الجامعي 📚</h1>
        <div class="card">
            <h3>مقرراتي الدراسية</h3>
            <div id="courses-list">جاري تحميل البيانات...</div>
        </div>
    </div>

    <script>
        // سحب البيانات مباشرة من ملف courses.json المرفوع على قيت هب
        async function loadCourses() {
            try {
                const response = await fetch('courses.json?t=' + Date.now()); // منع التخزين المؤقت
                const courses = await response.json();
                const coursesList = document.getElementById('courses-list');
                coursesList.innerHTML = '';

                if (courses.length === 0) {
                    coursesList.innerHTML = '<p style="text-align: center; color: #888;">لا توجد مقررات مضافة.</p>';
                    return;
                }

                courses.forEach(course => {
                    const badgeClass = course.type === 'لاب' ? 'badge badge-lab' : 'badge';
                    const div = document.createElement('div');
                    div.className = 'course-item';
                    div.innerHTML = `
                        <div class="course-info">
                            <div>
                                <strong>${course.name}</strong>
                                <span class="${badgeClass}">${course.type}</span>
                            </div>
                            <span>إجمالي الغيابات: <strong>${course.absent}</strong></span>
                        </div>
                    `;
                    coursesList.appendChild(div);
                });
            } catch (e) {
                document.getElementById('courses-list').innerHTML = '<p style="text-align: center; color: red;">فشل تحميل البيانات.</p>';
            }
        }
        loadCourses();
    </script>
</body>
</html>
